name: Build sing-box (Android, Windows)

on:
  workflow_dispatch:
    inputs:
      sing_box_branch:
        description: "sing-box reF1nd branch"
        required: true
        default: "reF1nd-testing"
      version:
        description: "Version (e.g. 1.14.0-alpha.30-reF1nd)"
        required: true
      enable_naive:
        description: "Enable naive outbound (requires cronet)"
        required: false
        type: boolean
        default: false
      enable_pushtg:
        description: "Enable push to telegram"
        required: true
        type: boolean
        default: true

env:
  GO_VERSION: "~1.25.11"
  TAGS_COMMON: "badlinkname,tfogo_checklinkname0,with_clash_api,with_quic,with_utls,with_conntrack,with_gvisor"
  TAGS_WINDOWS_EXTRA: ""
  TAGS_ANDROID_EXTRA: ""

jobs:
  build_cli:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            goos: windows
            arch: amd64v3
            goarch: amd64
            goamd64: v3
            binary: sing-box.exe
            artifact_name: binary-windows
          - platform: android
            os: ubuntu-latest
            goos: android
            arch: arm64
            goarch: arm64
            goamd64: ""
            cc_triple: "aarch64-linux-android23"
            binary: sing-box
            artifact_name: binary-android
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.sing_box_branch }}
          path: sing-box
          fetch-depth: 0

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set tag
        shell: bash
        run: |
          cd sing-box
          git tag v${{ github.event.inputs.version }} -f

      - name: Apply sing-box patches
        shell: bash
        run: |
          cd sing-box
          curl -sfL https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box/http_add_uot.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box/make_log_better.patch | git apply -v
          curl -sfL https://raw.githubusercontent.com/yagh779/sing-box-releases/patches/sing-box/change_default_urltest.patch | git apply -v

      - name: Compute build environment
        id: env
        shell: bash
        run: |
          TAGS="${TAGS_COMMON}"
          NAIVE="${{ inputs.enable_naive }}"
          CGO="0"
          ARCHIVE_SUFFIX=""

          if [[ "$NAIVE" == "true" ]]; then
            TAGS="${TAGS},with_naive_outbound"
          fi

          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            TAGS="${TAGS}${TAGS_WINDOWS_EXTRA}"
            # Windows uses purego mode to load cronet at runtime
            if [[ "$NAIVE" == "true" ]]; then
              TAGS="${TAGS},with_purego"
            fi
          fi

          if [[ "${{ matrix.platform }}" == "android" ]]; then
            CGO="1"
            TAGS="${TAGS}${TAGS_ANDROID_EXTRA}"
            # android with naive needs CGO and glibc suffix
            if [[ "$NAIVE" == "true" ]]; then
              ARCHIVE_SUFFIX="-glibc"
            fi
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "cgo=${CGO}" >> "$GITHUB_OUTPUT"
          echo "naive=${NAIVE}" >> "$GITHUB_OUTPUT"
          echo "archive_suffix=${ARCHIVE_SUFFIX}" >> "$GITHUB_OUTPUT"

          echo "--- Build Environment ---"
          echo "Platform: ${{ matrix.platform }}"
          echo "Tags: ${TAGS}"
          echo "CGO: ${CGO}"
          echo "Naive: ${NAIVE}"
          echo "Archive suffix: ${ARCHIVE_SUFFIX}"

      - name: Clone cronet-go
        if: steps.env.outputs.naive == 'true'
        shell: bash
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD

      - name: Init cronet-go submodules
        if: steps.env.outputs.naive == 'true' && matrix.platform != 'windows'
        run: |
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        if: steps.env.outputs.naive == 'true' && matrix.platform != 'windows'
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Download Chromium toolchain
        if: steps.env.outputs.naive == 'true' && matrix.platform != 'windows'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} download-toolchain

      - name: Set Chromium toolchain environment
        if: steps.env.outputs.naive == 'true' && matrix.platform != 'windows'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} env >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          mkdir -p dist
          if [[ -n "${{ matrix.cc_triple }}" ]]; then
            export CC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc_triple }}-clang"
          fi
          go build -v -trimpath -o "dist/${{ matrix.binary }}" \
            -tags "${{ steps.env.outputs.tags }}" \
            -ldflags '-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
            ./cmd/sing-box
        env:
          CGO_ENABLED: ${{ steps.env.outputs.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}

      - name: Extract libcronet.dll
        if: steps.env.outputs.naive == 'true' && matrix.platform == 'windows'
        shell: bash
        run: |
          cd ~/cronet-go
          CGO_ENABLED=0 go run -v ./cmd/build-naive extract-lib --target windows/${{ matrix.goarch }} -o "$GITHUB_WORKSPACE/sing-box/dist"

      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd sing-box/dist
          $DIR_NAME = "sing-box-${{ github.event.inputs.version }}-windows-${{ matrix.arch }}"
          mkdir "$DIR_NAME"
          Copy-Item ../LICENSE "$DIR_NAME/"
          Copy-Item sing-box.exe "$DIR_NAME/"
          if ("${{ steps.env.outputs.naive }}" -eq "true" -and (Test-Path libcronet.dll)) {
            Copy-Item libcronet.dll "$DIR_NAME/"
          }
          Compress-Archive -Path "$DIR_NAME" -DestinationPath "$DIR_NAME.zip"
          Remove-Item -Recurse "$DIR_NAME"
          Remove-Item sing-box.exe
          if (Test-Path libcronet.dll) { Remove-Item libcronet.dll }

      - name: Archive (Android)
        if: matrix.platform == 'android'
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ github.event.inputs.version }}-android-${{ matrix.arch }}${{ steps.env.outputs.archive_suffix }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: sing-box/dist/*

  publish:
    name: Publish Release
    needs: build_cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute tags for release notes
        id: tags
        run: |
          CLI="${TAGS_COMMON}"
          if [[ "${{ inputs.enable_naive }}" == "true" ]]; then
            CLI="${CLI},with_naive_outbound"
          fi
          echo "android=${CLI}${TAGS_ANDROID_EXTRA}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.enable_naive }}" == "true" ]]; then
            echo "windows=${CLI}${TAGS_WINDOWS_EXTRA},with_purego" >> "$GITHUB_OUTPUT"
          else
            echo "windows=${CLI}${TAGS_WINDOWS_EXTRA}" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ inputs.enable_naive }}" == "true" ]]; then
            echo "naive_note=naive outbound enabled" >> "$GITHUB_OUTPUT"
          else
            echo "naive_note=naive outbound disabled" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: dev
          path: repo
          fetch-depth: 0

      - name: Cleanup dev branch
        id: cleanup_dev
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan temp
          git rm -rf . 2>/dev/null || true

          git show dev:LICENSE > LICENSE
          git add LICENSE
          git commit -m "add LICENSE"

          mkdir -p .github/workflows
          git show dev:.github/workflows/build-all.yml > .github/workflows/build-all.yml
          git add .github/workflows/build-all.yml
          git commit -m "ci: build-all workflow"

          cat > build-info.json << EOF
          {
            "version": "${{ github.event.inputs.version }}",
            "sing_box_branch": "${{ github.event.inputs.sing_box_branch }}",
            "enable_naive": ${{ inputs.enable_naive }},
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${{ github.run_id }}"
          }
          EOF
          git add build-info.json
          git commit -m "build: v${{ github.event.inputs.version }}"

          git branch -M dev
          git push --force origin dev

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Delete older releases
        run: |
          echo "Deleting all existing releases and tags..."
          for tag in $(gh release list --repo "$REPO" --json tagName -q '.[].tagName' 2>/dev/null); do
            echo "Deleting release: $tag"
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          done
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Create Release
        run: |
          cat > /tmp/release-body.md << RELEASE_EOF
          #### Release Notes

          - Built from sing-box branch: \`$SING_BOX_BRANCH\`
          - Naive outbound: **$NAIVE_NOTE**
          - Windows: amd64v3$WINDOWS_SUFFIX
          - Android: arm64$ANDROID_SUFFIX

          #### Patches
          - \`http_add_uot.patch\`
          - \`make_log_better.patch\`
          - \`change_default_urltest.patch\`

          #### Build Tags
          - **Windows:** \`$TAGS_WINDOWS\`
          - **Android:** \`$TAGS_ANDROID\`
          RELEASE_EOF

          sed -i 's/^          //' /tmp/release-body.md

          gh release create "v$VERSION" \
            --repo "$REPO" \
            --title "$VERSION" \
            --target "$TARGET_SHA" \
            --notes-file /tmp/release-body.md \
            --prerelease \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.event.inputs.version }}
          TARGET_SHA: ${{ steps.cleanup_dev.outputs.sha }}
          SING_BOX_BRANCH: ${{ github.event.inputs.sing_box_branch }}
          NAIVE_NOTE: ${{ steps.tags.outputs.naive_note }}
          WINDOWS_SUFFIX: ${{ inputs.enable_naive && ', purego + libcronet.dll' || '' }}
          ANDROID_SUFFIX: ${{ inputs.enable_naive && ', glibc + Chromium toolchain' || '' }}
          TAGS_WINDOWS: ${{ steps.tags.outputs.windows }}
          TAGS_ANDROID: ${{ steps.tags.outputs.android }}

      # === Cleanup: only runs after release succeed ===

      - name: Cleanup patches branch
        continue-on-error: true
        run: |
          cd repo
          git fetch origin patches
          git checkout patches
          git checkout --orphan temp
          git rm -rf . 2>/dev/null || true

          for f in $(git ls-tree -r --name-only patches -- sing-box/); do
            mkdir -p "$(dirname "$f")"
            git show "patches:$f" > "$f"
            git add "$f"
            git commit -m "patch(sing-box): $(basename $f .patch)"
          done

          # Commit any remaining files (outdated/, pr/, etc.)
          for f in $(git ls-tree -r --name-only patches | grep -v '^sing-box/'); do
            mkdir -p "$(dirname "$f")"
            git show "patches:$f" > "$f"
          done
          git add -A
          git diff --cached --quiet || git commit -m "build: v${{ github.event.inputs.version }}"

          git branch -M patches
          git push --force origin patches

      - name: Delete old workflow runs
        continue-on-error: true
        run: |
          echo "Cleaning up old workflow runs..."
          CURRENT_RUN="${{ github.run_id }}"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' | while read run_id; do
            if [ "$run_id" = "$CURRENT_RUN" ]; then
              echo "Skipping current run: $run_id"
              continue
            fi
            gh api "repos/$REPO/actions/runs/$run_id" -X DELETE || echo "  Warning: failed to delete run $run_id"
            echo "Deleted run: $run_id"
          done
          echo "Cleanup complete"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

  release-tg:
    name: Release TG
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ inputs.enable_pushtg }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Upload dist files to Telegram
        uses: xireiki/channel-post@v2
        with:
          chat_id: "${{ secrets.CHAT_ID }}"
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          path: dist/*
          context: "sing-box-${{ github.event.inputs.version }}"
          parse_mode: HTML
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          method: sendFile
